<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Juicy Wiki — 자료와 지식을 연결하는 개인 위키">
    <meta name="color-scheme" content="light dark">
    <title>Juicy Wiki</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #202122; background: #f8f9fa; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { padding: 24px max(24px, calc((100vw - 960px) / 2)); border-bottom: 1px solid #c8ccd1; background: #fff; }
      .brand { margin: 0; font-family: Georgia, serif; font-size: 28px; letter-spacing: -.5px; }
      .tagline { margin: 6px 0 0; color: #54595d; font-size: 14px; }
      main { max-width: 960px; margin: 64px auto; padding: 0 24px; }
      article { padding: clamp(24px, 5vw, 48px); border: 1px solid #c8ccd1; background: #fff; }
      h1 { margin: 0 0 24px; padding-bottom: 16px; border-bottom: 1px solid #a2a9b1; font-size: clamp(26px, 5vw, 36px); font-weight: 500; }
      p { line-height: 1.8; word-break: keep-all; }
      .note { color: #54595d; font-size: 14px; }
      footer { max-width: 960px; margin: 0 auto; padding: 0 24px 32px; color: #54595d; font-size: 13px; }
      @media (prefers-color-scheme: dark) {
        :root { color: #eaecf0; background: #101418; }
        header, article { background: #181d23; border-color: #54595d; }
        h1 { border-color: #72777d; }
        .tagline, .note, footer { color: #a2a9b1; }
      }
    </style>
  </head>
  <body>
    <header>
      <p class="brand">Juicy Wiki</p>
      <p class="tagline">자료와 지식을 연결하는 위키</p>
    </header>
    <main>
      <article aria-labelledby="welcome">
        <h1 id="welcome">Juicy Wiki</h1>
        <p>Juicy Wiki에 오신 것을 환영합니다.</p>
        <p>문서를 읽고, 관련 개념을 따라가며, 필요한 내용을 검색하세요.</p>
        <p><a href="wiki/">실시간 위키 열기 →</a></p>
        <p class="note">공개된 개념 문서 3개로 시작합니다. 호스트의 변경 사항이 자동으로 반영됩니다.</p>
      </article>
    </main>
    <footer>Juicy Wiki</footer>
  </body>
</html>
