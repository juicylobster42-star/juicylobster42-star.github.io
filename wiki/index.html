<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="호스트의 지식과 연결되는 Juicy Wiki">
  <title>Juicy Wiki · Live</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="vendor/marked.js"></script>
  <script defer src="vendor/purify.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header><a class="brand" href="./">Juicy Wiki <span>LIVE</span></a><p>자료와 지식을 연결하는 작은 위키</p></header>
  <div class="connection"><span id="status" role="status">연결 중…</span><button id="refresh">지금 새로고침</button></div>
  <main><aside><label for="search">공개 문서 검색</label><input id="search" type="search" placeholder="제목 또는 태그"><nav id="pages" aria-label="문서 목록"></nav><p class="hint">공개된 문서만 표시합니다.<br>변경 사항은 5초마다 확인합니다.</p></aside>
  <article><div id="meta"></div><div id="content"><h1>지식을 불러오고 있습니다</h1><p>잠시만 기다려 주세요.</p></div></article></main>
  <footer>Juicy Wiki · 호스트의 문서와 연결된 읽기 전용 데모</footer>
</body></html>
